name: Auto Backfill — 1993 to 2024 (manual only)

on:
  workflow_dispatch:

concurrency:
  group: mawire-platform-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout mawire-db
        uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill 1993–2024 (stops gracefully at 10 min)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          BACKFILL_START_YEAR: '1993'
          BACKFILL_END_YEAR: '2024'
          BACKFILL_TIME_LIMIT_MINUTES: '10'
        run: node FIX-historical-backfill.js

      - name: Publication ownership
        run: echo "Database backfill complete. The hourly verified refresh workflow is the sole publisher of public deal artifacts."
