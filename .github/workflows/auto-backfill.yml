name: Auto Backfill — 1993 to 2024 (runs every 4 hours)

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
  workflow_dispatch:

concurrency:
  group: auto-backfill
  cancel-in-progress: false  # never cancel a running backfill

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - name: Checkout mawire-db
        uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install pg

      - name: Backfill 1993–2024 (stops gracefully at 100 min)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_START_YEAR: '1993'
          BACKFILL_END_YEAR: '2024'
          BACKFILL_TIME_LIMIT_MINUTES: '100'
        run: node FIX-historical-backfill.js

      - name: Export full DB → deals.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOCAL_ONLY: 'true'
        run: node FIX-export-to-github.js

      - name: Commit and push deals.json
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          if git diff --cached --quiet; then
            echo "No new deals — nothing to commit"
          else
            git commit -m "chore: backfill deals.json [skip ci]"
            git pull --rebase https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git main
            git push https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git HEAD:main
          fi
