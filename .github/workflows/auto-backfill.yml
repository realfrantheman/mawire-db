name: Auto Backfill — 1993 to 2024 (runs every 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

concurrency:
  group: auto-backfill
  cancel-in-progress: false  # never cancel a running backfill

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout mawire-db
        uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install pg

      - name: Backfill 1993–2024 (stops gracefully at 25 min)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_START_YEAR: '1993'
          BACKFILL_END_YEAR: '2024'
          BACKFILL_TIME_LIMIT_MINUTES: '25'
        run: node FIX-historical-backfill.js

      - name: Export full DB → deals.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOCAL_ONLY: 'true'
        run: node FIX-export-to-github.js

      - name: Commit and push deals.json
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save the freshly exported file before resetting
          cp deals.json /tmp/deals.json
          # Sync to latest main (avoids rebase conflicts on deals.json)
          git fetch origin main
          git reset --hard origin/main
          # Re-apply the export (DB is always authoritative)
          cp /tmp/deals.json deals.json
          git add deals.json
          if git diff --cached --quiet; then
            echo "No new deals — nothing to commit"
          else
            git commit -m "chore: backfill deals.json [skip ci]"
            git push https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git HEAD:main
          fi
