name: Deploy to mawire-platform and mawire-site

on:
  push:
    branches:
      - main
      - 'repair/**'
    paths:
      - 'DEPLOY-*'
      - 'FIX-*.js'
      - 'FIX-*.sql'
      - 'app.js'
      - 'style.css'
      - 'deploy.py'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-mawire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate JavaScript release artifacts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if grep -Eq '^[[:space:]]*(import|export)\b' "$file"; then
              node --input-type=module --check < "$file"
            else
              node --check "$file"
            fi
          done < <(find . -maxdepth 1 -type f \( -name 'FIX-*.js' -o -name 'DEPLOY-*.js' -o -name '*.js' \) -print0)
      - name: Validate deployment controller
        run: python3 -m py_compile deploy.py
      - name: Atomic deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
          DEPLOY_PLATFORM_FIXES: 'true'
        run: python3 deploy.py
