name: One-off public data diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect exact pre-refresh corpus
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const baseline = '94bf5439a2becd25133d0e53c985ef87059f458c';
          const oldIndex = JSON.parse(cp.execFileSync('git',['show',`${baseline}:deals-index.json`],{encoding:'utf8',maxBuffer:150*1024*1024}));
          const oldDeals = JSON.parse(cp.execFileSync('git',['show',`${baseline}:deals.json`],{encoding:'utf8',maxBuffer:150*1024*1024}));
          const indexIds = new Set(oldIndex.map(d=>String(d.id)));
          const missing = oldDeals.filter(d=>!indexIds.has(String(d.id)));
          const dupeIds = oldDeals.filter((d,i,a)=>a.findIndex(x=>String(x.id)===String(d.id))!==i);
          console.log('BASELINE_COUNTS', JSON.stringify({deals:oldDeals.length,index:oldIndex.length,missing:missing.length,duplicateDealIds:dupeIds.length}));
          console.log('MISSING_FROM_INDEX', JSON.stringify(missing));
          console.log('DUPLICATE_IDS', JSON.stringify(dupeIds.slice(0,10)));
          NODE
