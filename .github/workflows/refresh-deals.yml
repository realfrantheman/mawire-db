name: Refresh deals.json from SEC EDGAR

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout mawire-db
        uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install pg

      - name: Ingest new SEC filings (last 8 days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOOKBACK_DAYS: '8'
        run: node FIX-sec-ingestor-index.js

      - name: Export full DB → deals.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOCAL_ONLY: 'true'
        run: node FIX-export-to-github.js

      - name: Commit and push deals.json
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: refresh deals.json [skip ci]"
          git push https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git HEAD:main

      - name: Run IPO fetcher (S-1 filings — metadata only, no S-1 text download)
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
          FETCH_S1_TEXT: 'false'
        run: node fetch-ipos.js
