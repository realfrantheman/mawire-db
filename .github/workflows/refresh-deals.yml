name: Refresh public M&A data

on:
  schedule:
    - cron: '12 */4 * * *'
  workflow_dispatch:

concurrency:
  group: mawire-db-artifact-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Backfill missing direct SEC source documents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_BACKFILL_LIMIT: '200'
        run: node FIX-source-url-backfill.js
      - name: Ingest new SEC filings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOOKBACK_DAYS: '2'
        run: node FIX-sec-ingestor-index.js
      - name: Export database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOCAL_ONLY: 'true'
        run: node FIX-export-to-github.js
      - name: Build compact public index and detail shards
        run: node build-public-artifacts.js deals.json
      - name: Validate source URLs
        run: node validate-source-urls.js deals-index.json
      - name: Commit public data artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json deals-index.json deals-public-manifest.json deals-details/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh public M&A data [skip ci]"
            git pull --rebase https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git main
            git push https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git HEAD:main
          fi
      - name: Refresh IPO metadata
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
          PUBLISH_IPOS: 'true'
          IPO_LOOKBACK_YEARS: '3'
          IPO_MAX_METADATA: '3000'
          IPO_MAX_FULL_TEXT: '5'
        run: node fetch-ipos.js
