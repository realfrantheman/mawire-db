name: Refresh verified public M&A data
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
concurrency:
  group: mawire-db-artifact-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Backfill direct SEC sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          SOURCE_BACKFILL_LIMIT: '250'
        run: node FIX-source-url-backfill.js
      - name: Ingest SEC candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          LOOKBACK_DAYS: '3'
        run: node FIX-sec-ingestor-index.js
      - name: Verify transactions against primary sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          TRANSACTION_REVIEW_RULE_VERSION: strict-control-v3
          TRANSACTION_REVIEW_LIMIT: '30000'
          TRANSACTION_REVIEW_CONCURRENCY: '4'
          TRANSACTION_REVIEW_POLITENESS_MS: '400'
        run: node FIX-transaction-review.js
      - name: Export verified transactions only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          LOCAL_ONLY: 'true'
          TRANSACTION_REVIEW_RULE_VERSION: strict-control-v3
        run: node FIX-export-to-github.js
      - run: node build-public-artifacts.js deals.json
      - run: node validate-source-urls.js deals-index.json
      - name: Verify publication gate
        run: |
          node - <<'NODE'
          const a=JSON.parse(require('fs').readFileSync('deals-index.json','utf8'));const b=a.filter(d=>d.reviewStatus!=='verified'||d.reviewRuleVersion!=='strict-control-v3'||!d.acquirer||!d.target||/^(unknown|undisclosed)/i.test(d.acquirer)||/^(unknown|undisclosed)/i.test(d.target)||!/^https?:\/\//.test(d.sourceUrl||''));if(b.length)throw Error('unverified rows escaped: '+b.length);if(a.some(d=>/dynatrace/i.test(d.target||'')&&/undisclosed/i.test(d.acquirer||'')))throw Error('Dynatrace regression');console.log('VERIFIED_PUBLIC_RECORDS='+a.length)
          NODE
      - name: Commit verified artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add deals.json deals-index.json deals-public-manifest.json deal-review-manifest.json deals-details/
          if git diff --cached --quiet; then
            echo 'No verified artifact changes'
          else
            git commit -m 'chore: publish verified M&A transactions [skip ci]'
            git pull --rebase https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git main
            git push https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git HEAD:main
          fi
      - name: Publish optimized public artifacts to site
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
          DEPLOY_SITE_DATA_ONLY: 'true'
        run: python3 deploy.py
