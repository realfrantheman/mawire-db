name: Platform Integrity Engine

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh verified public M&A data
    types:
      - completed

concurrency:
  group: mawire-db-artifact-writes
  cancel-in-progress: false

jobs:
  pie:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Probe PostgreSQL integrity source
        id: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          DATABASE_PROBE_TIMEOUT_MS: '5000'
        run: node database-probe.js
      - name: Run database-backed platform integrity checks
        if: steps.database.outputs.available == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          MAWIRE_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: node FIX-pie-monitor.js
      - name: Run artifact and production-origin integrity checks
        if: steps.database.outputs.available != 'true'
        env:
          PIE_PUBLIC_ORIGIN: https://mawire.vercel.app
          PIE_MAX_ARTIFACT_AGE_HOURS: '3'
          PIE_MIN_PUBLIC_DEALS: '10000'
        run: node FIX-file-integrity.js
