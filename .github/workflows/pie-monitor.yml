name: Platform Integrity Engine

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

concurrency:
  group: pie-monitor
  cancel-in-progress: true

jobs:
  pie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run fail-closed integrity checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAWIRE_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: node FIX-pie-monitor.js
