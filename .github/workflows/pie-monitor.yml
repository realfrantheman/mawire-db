name: Platform Integrity Engine

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

concurrency:
  group: mawire-db-artifact-writes
  cancel-in-progress: false

jobs:
  pie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run platform integrity checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          MAWIRE_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: node FIX-pie-monitor.js
