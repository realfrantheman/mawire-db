name: Refresh IPO lifecycle data
on:
  push:
    branches: [main]
    paths:
      - fetch-ipos.js
      - ipo-data.js
      - ipo-enrichment.js
      - ipo-overrides.json
      - .github/workflows/refresh-ipos.yml
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
concurrency:
  group: mawire-db-ipo-lifecycle-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Preserve prior lifecycle state
        run: cp ipos.json /tmp/ipos-before-refresh.json
      - name: Refresh SEC IPO lifecycle records
        env:
          IPO_LOOKBACK_YEARS: '3'
          IPO_MAX_METADATA: '6000'
          IPO_MAX_FULL_TEXT: '100'
        run: node fetch-ipos.js
      - name: Prevent terminal lifecycle regressions
        run: node harden-ipo-artifact.js /tmp/ipos-before-refresh.json ipos.json
      - run: npm test
      - run: node build-ipo-freshness.js
      - name: Publish IPO data atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ipos.json ipo-freshness.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh IPO lifecycle data [skip ci]'
          git pull --rebase https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git main
          git push https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git HEAD:main
