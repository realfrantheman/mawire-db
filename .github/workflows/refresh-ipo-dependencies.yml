name: Refresh IPO dependency evidence

on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: IPO records to inspect
        required: false
        default: '250'

concurrency:
  group: mawire-db-artifact-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: .cache/ipo-dependencies
          key: ipo-dependencies-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ipo-dependencies-${{ runner.os }}-
      - name: Inspect oldest unattempted IPO records
        env:
          DEPENDENCY_FETCH_LIMIT: ${{ inputs.limit || '250' }}
          DEPENDENCY_URLS_PER_RECORD: '2'
          DEPENDENCY_REFRESH_DAYS: '90'
          DEPENDENCY_POLITENESS_MS: '175'
        run: node build-ipo-dependency-graphs.js
      - name: Validate and publish dependency evidence
        run: |
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipos.json
          git diff --cached --quiet && exit 0
          git commit -m "IPO dependencies: refresh SEC evidence"
          git pull --rebase origin main
          git push origin main
