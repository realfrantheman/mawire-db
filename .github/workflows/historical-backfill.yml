name: Historical M&A Backfill

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start year (e.g. 2020) — leave blank to auto (current year - 1)'
        required: false
        default: ''
      end_year:
        description: 'End year (e.g. 2026) — leave blank to auto (current year)'
        required: false
        default: ''

concurrency:
  group: mawire-platform-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - name: Checkout mawire-db
        uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve backfill year range
        id: years
        run: |
          YEAR=$(date +%Y)
          PREV=$((YEAR - 1))
          START="${{ github.event.inputs.start_year }}"
          END="${{ github.event.inputs.end_year }}"
          echo "start_year=${START:-$PREV}" >> "$GITHUB_OUTPUT"
          echo "end_year=${END:-$YEAR}" >> "$GITHUB_OUTPUT"

      - name: Run historical backfill (${{ steps.years.outputs.start_year }}–${{ steps.years.outputs.end_year }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ALLOW_SELF_SIGNED: 'true'
          BACKFILL_START_YEAR: ${{ steps.years.outputs.start_year }}
          BACKFILL_END_YEAR: ${{ steps.years.outputs.end_year }}
        run: node FIX-historical-backfill.js

      - name: Publication ownership
        run: echo "Historical database backfill complete. The hourly verified refresh workflow is the sole publisher of public deal artifacts."
