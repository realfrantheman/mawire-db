name: Historical M&A Backfill (manual)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start year (e.g. 2020)'
        required: true
        default: '2020'
      end_year:
        description: 'End year (e.g. 2024)'
        required: true
        default: '2024'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - name: Checkout mawire-db
        uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-db
          token: ${{ secrets.MAWIRE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install pg

      - name: Run historical backfill (${{ github.event.inputs.start_year }}–${{ github.event.inputs.end_year }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_START_YEAR: ${{ github.event.inputs.start_year }}
          BACKFILL_END_YEAR: ${{ github.event.inputs.end_year }}
        run: node FIX-historical-backfill.js

      - name: Export full DB → deals.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOCAL_ONLY: 'true'
        run: node FIX-export-to-github.js

      - name: Commit and push deals.json
        env:
          GITHUB_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: backfill deals.json ${{ github.event.inputs.start_year }}-${{ github.event.inputs.end_year }} [skip ci]"
          git push https://x-access-token:${{ secrets.MAWIRE_TOKEN }}@github.com/realfrantheman/mawire-db.git HEAD:main
