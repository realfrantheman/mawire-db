name: Platform Integrity Engine
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
jobs:
  pie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: realfrantheman/mawire-monitor
          token: ${{ secrets.MAWIRE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install pg
      - run: node index.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAWIRE_TOKEN: ${{ secrets.MAWIRE_TOKEN }}
